name: Prepare exact source for evidence review
on:
  push:
    branches: [reading-evidence-autoconnect-v52]
    paths: [.github/workflows/review-source52.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle public source without private data
        run: |
          mkdir -p /tmp/review52
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.')
          with zipfile.ZipFile('/tmp/review52/public-source52.zip','w',zipfile.ZIP_DEFLATED) as z:
            for folder in ['src','scripts','content','examples','resources','.github']:
              for p in pathlib.Path(folder).rglob('*'):
                if p.is_file() and (p.suffix in ['.js','.py','.mjs','.json','.css','.html','.md','.txt','.csv','.svg','.R','.yml','.yaml','.toml'] or p.name=='manifest.webmanifest'):
                  if p.stat().st_size < 12000000: z.write(p,p.as_posix())
            for name in ['AGENTS.md','README.md','package.json','package-lock.json']:
              p=root/name
              if p.exists():z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-public-source52
          path: /tmp/review52/public-source52.zip
          retention-days: 3
