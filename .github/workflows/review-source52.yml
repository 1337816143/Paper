name: Prepare exact source for evidence review
on:
  push:
    branches: [reading-evidence-autoconnect-v52]
    paths: [.github/workflows/review-source52.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle licensed browser runtime and existing equation crops
        run: |
          mkdir -p /tmp/review52
          python - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('/tmp/review52/runtime52.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('vendor').rglob('*'):
              if p.is_file():z.write(p,p.as_posix())
            for p in pathlib.Path('resources/library').rglob('math-v3-*'):
              if p.is_file():z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-reviewed-runtime52
          path: /tmp/review52/runtime52.zip
          retention-days: 3
