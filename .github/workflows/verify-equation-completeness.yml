name: Verify complete equation display
on:
  push:
    branches: [study-equation-completeness-v3]
    paths: [.github/workflows/verify-equation-completeness.yml, scripts/equation-build-trigger.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-equation-completeness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study-equation-completeness-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve every expression in source-matched formula regions
        run: |
          pip install PyMuPDF==1.26.4 playwright==1.55.0
          python scripts/prepare_math_layouts.py
          python scripts/finalize_math_checks.py
          python scripts/build.py --source-commit="$GITHUB_SHA"
          python -m playwright install --with-deps chromium > /tmp/browser-install.log 2>&1
      - name: Existing reading and annotation regressions
        run: |
          python scripts/test_browser.py > /tmp/browser-check.log 2>&1 || { tail -80 /tmp/browser-check.log; exit 1; }
          python scripts/test_reader.py
      - name: All study features and strict equation-number completeness
        run: python scripts/test_study.py
      - name: Commit only verified scientific presentation and tests
        run: |
          git config user.name paper-study-builder
          git config user.email paper-study-builder@users.noreply.github.com
          git add resources/study-layouts.json resources/study-layout-audit.json resources/library scripts/build_reader.py scripts/build_study.py scripts/test_study.py
          if ! git diff --cached --quiet; then
            git commit -m "Preserve all adjacent numbered equations in default reflow display"
            git pull --rebase origin study-equation-completeness-v3
            git push origin HEAD:study-equation-completeness-v3
          fi
      - name: Collect exact public acceptance evidence
        if: always()
        run: |
          mkdir -p test-results
          cp dist/site/release.json test-results/study-release.json 2>/dev/null || true
          cp resources/study-layout-audit.json test-results/ 2>/dev/null || true
          git rev-parse HEAD > test-results/study-source-commit.txt
          python - <<'PY'
          from pathlib import Path
          import json
          for name in ['study-report.json','study-release.json','study-layout-audit.json']:
            p=Path('test-results')/name
            if p.exists():print(name+'='+json.dumps(json.loads(p.read_text()),ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-equation-acceptance
          path: test-results
          retention-days: 30
