name: Test and publish Paper Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned synthetic Q numeric runtime
        run: pip install numpy==2.3.5
      - name: Build and check teaching algorithms and source archive
        run: |
          python scripts/build.py --source-commit="$GITHUB_SHA"
          for file in app offline-downloads reader study translation-worker workspace sync comfort research research-review release personal contracts research-library context-notes research-walkthrough rda-model rda-walkthrough q-walkthrough annual-balance-model annual-balance-walkthrough dong-boundary-model dong-boundary; do node --check "src/$file.js"; done
          python tests/method_transfer_static.py
          python tests/research_leads_static.py
          node tests/research_leads_render.cjs
          python examples/pareto_lab.py --test
          python examples/sequence_lab.py
          python examples/paper_minilab.py --test
          python examples/model_reasoning_lab.py --test
          python scripts/test_learning_depth.py
          python scripts/test_farmsteps_research.py
          python scripts/test_thesis_evidence.py
          python examples/exemplar_transfer.py --test
          python scripts/test_exemplar_transfer.py
          python examples/seven_indicators_worked.py --test
          python examples/research_pipeline_walkthrough.py --test
          python scripts/test_explanation_depth.py
          python scripts/test_context_notes_data.py
          python examples/farm_walkthrough.py --test
          node tests/research-walkthrough/math.test.cjs
          node tests/research-walkthrough/dom.test.cjs
          python examples/rda_walkthrough.py --test
          node tests/rda/math.test.cjs
          node tests/rda/dom.test.cjs
          python scripts/test_rda_sources.py
          python examples/q_pipeline.py --test
          python tests/q/math_checks.py
          python tests/q/si_checks.py
          python examples/q_si_categories.py --test
          python -m unittest discover -s tests -p test_dong_boundary_lab.py -v
          python tests/dong/parity.py
          node tests/dong/math.test.cjs
          node tests/dong/dom.test.cjs
          python tests/dong/sources.py
          node tests/q/dom.test.cjs
          python scripts/test_q_sources.py
          python examples/annual_balance.py --test
          python tests/annual-balance/parity.py
          node tests/annual-balance/math.test.cjs
          node tests/annual-balance/dom.test.cjs
          python scripts/test_annual_balance_sources.py
          node --check src/sw-template.js
          node tests/offline/sw_runtime.cjs
          node tests/offline/ui_contract.cjs
          node tests/offline/downloads.cjs
          python tests/offline/test_manifest.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: false
      - name: Compare the synthetic Q chain with pinned official R packages
        run: |
          python tests/q/compare_r_reference.py --fetch-sources /tmp/q-r-sources
          Rscript -e 'install.packages(c("mnormt", "GPArotation", "digest", "knitr", "xtable"), repos="https://cloud.r-project.org"); install.packages("/tmp/q-r-sources/psych_2.5.6.tar.gz", repos=NULL, type="source"); install.packages("/tmp/q-r-sources/qmethod_1.8.4.tar.gz", repos=NULL, type="source")'
          mkdir -p test-results/q-reference
          Rscript examples/qmethod_reference.R --output-dir test-results/q-reference
          python tests/q/compare_r_reference.py --reference-dir test-results/q-reference --output test-results/q-reference/parity-report.json
      - name: Install browser test runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test additive method transfer, old anchors and offline text
        run: python tests/method_transfer_browser.py
      - name: Test research introductions, original annotations and offline text
        run: python tests/research_leads_browser.py
      - name: Test research library and legacy data compatibility
        run: python scripts/test_research_library.py
      - name: Test contextual explanations, keyboard, mobile and offline
        run: python scripts/test_context_notes.py
      - name: Test visual walkthrough, motion, lifecycle and actual integration
        run: |
          python tests/research-walkthrough/browser_test.py
          python scripts/test_walkthrough_integration.py
      - name: Test existing tutorials
        run: python scripts/test_browser.py
      - name: Test RDA figure walkthrough, legacy anchors, notes and offline integration
        run: |
          python tests/rda/browser_test.py
          python scripts/test_rda_walkthrough.py
      - name: Test the Q selection chain, history, downloads and offline integration
        run: |
          python tests/q/browser_test.py
          python scripts/test_q_walkthrough.py
      - name: Test Dong SI live synthetic calculation, preserved source IDs, notes and downloads
        run: python tests/dong/browser_test.py
      - name: Test annual balances, actual downloads, history, old notes and offline
        run: |
          python tests/annual-balance/browser_test.py
          python scripts/test_annual_balance_integration.py
      - name: Test original reading, annotations and full offline
        run: python scripts/test_reader.py
      - name: Test framework, terminology, equations and actual offline translation
        run: python scripts/test_study.py
      - name: Test real metadata queries, local imports, backup and source-defined terminology
        run: |
          python scripts/test_workspace.py
          python scripts/test_workspace_hardening.py
      - name: Test compact notes, custom tags and private-sync semantics
        run: python scripts/test_v5.py
      - name: Test safe automatic releases
        run: python scripts/test_release51.py
      - name: Test research evidence and all manual-input surfaces
        run: python scripts/test_research_v53.py
      - name: Test source-linked units, boundary and scenario lessons
        run: python scripts/test_learning_depth_browser.py
      - name: Test private-entry persistence, two profiles and method ledgers with synthetic credentials only
        run: python scripts/test_personal_v54.py
      - name: Save public acceptance reports
        run: |
          cp test-results/study-report.json dist/site/study-validation.json
          cp test-results/workspace-report.json dist/site/workspace-validation.json
          cp test-results/workspace-hardening-report.json dist/site/workspace-hardening-validation.json
          cp test-results/v5-report.json dist/site/v5-validation.json
          cp test-results/release51-report.json dist/site/release51-validation.json
          cp test-results/research-v53-report.json dist/site/research-v53-validation.json
          cp test-results/personal-v54-report.json dist/site/personal-v54-validation.json
      - name: Seal and test the exact final deployed tree including reports and ZIPs
        run: |
          python scripts/seal_site.py --audit test-results/offline-deployment-exact-tree.json
          python tests/offline/test_manifest.py
          python tests/offline/single_entry_browser.py
          python scripts/test_full_offline.py
          python scripts/seal_site.py --check --audit test-results/offline-deployment-exact-tree.json
      - name: Preserve exact deployment audit independently of the sealed site
        uses: actions/upload-artifact@v4
        with:
          name: paper-exact-deployment-audit
          path: test-results/offline-deployment-exact-tree.json
          retention-days: 30
      - name: Save bounded full-offline acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-offline-acceptance
          path: |
            test-results/offline-deployment-exact-tree.json
            test-results/full-offline-report.json
            test-results/full-offline-desktop.png
            test-results/full-offline-mobile.png
            test-results/full-offline-portable.png
          retention-days: 30
      - name: Save single HTML subdirectory and file-protocol acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-single-entry-acceptance
          path: test-results/single-entry
          retention-days: 30
      - name: Save bounded Dong SI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-dong-acceptance
          path: |
            test-results/dong
            test-results/dong-parity.json
          retention-days: 30
      - name: Save test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-site-and-tests
          path: test-results
          retention-days: 30
      - name: Save bounded annual-balance acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-annual-acceptance
          path: |
            test-results/annual-balance
            test-results/annual-*
          retention-days: 30
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public release and bounded private-entry capability
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "${PAGE_URL%/}/release.json?verify=$GITHUB_SHA" -o live-release.json && python -c "import json,os; d=json.load(open('live-release.json')); assert d['sourceCommit']==os.environ['GITHUB_SHA']; assert d['appVersion']=='5.5.13'; assert d['fullOffline']['allDeployedPayloads']; assert d['fullOffline']['hostedDownloadZIPs']; assert d['annualBalance']['inputConfigurations']==4410; assert not d['annualBalance']['sourceDataReproduced']; assert not d['annualBalance']['agronomicResponseValidated']; assert d['qWalkthrough']['syntheticStatements']==20; assert d['qWalkthrough']['syntheticPeople']==10; assert d['qWalkthrough']['scenarios']==2; assert not d['qWalkthrough']['authorResultsReproduced']; assert d['qWalkthrough']['authorScalingVerified']; assert d['qWalkthrough']['sourceCorrectionVersion']=='5.5.9'; assert d['qWalkthrough']['publishedPerspectives']==18; assert d['qWalkthrough']['publishedCategoryCells']==72; assert d['dongBoundary']['syntheticOnly']; assert not d['dongBoundary']['authorResultsReproduced']; assert d['dongBoundary']['legacyMainSections']==9; assert d['dongBoundary']['legacyLedgerSections']==6; assert d['qWalkthrough']['originalSectionCount']==20; assert d['qWalkthrough']['appendedSourceSections']==3; assert d['rdaWalkthrough']['syntheticRecords']==4; assert not d['rdaWalkthrough']['authorPlotScalingVerified']; assert not d['rdaWalkthrough']['RParityVerified']; assert d['contextualExplanations']['annotations']==18; assert d['contextualExplanations']['paperPages']==6; assert d['archivedOriginals']>=12; assert d['studyFrameworks']==21; assert d['glossaryTerms']>=98; assert d['translation']['offlineModelIncluded']; assert d['workspace']=='private-sync-v5'; assert d['sync']['requiresUserAuthorization']; assert d['researchStudio']['samplingCards']>=32; assert d['researchStudio']['indicatorDefinitions']==7; assert d['methodContracts']['count']==22; assert not d['methodContracts']['masteryInferredFromVisit']; assert not d['personalEntry']['anonymousPublicAccess']; assert not d['personalEntry']['provisionedByPublicBuild']; print(d)"; then
              verified=true; break
            fi
            sleep 5
          done
          test "$verified" = true
          for name in study-data workspace sync release research personal contracts context-notes-data context-notes research-walkthrough rda-walkthrough-data rda-model rda-walkthrough q-walkthrough-data q-walkthrough annual-balance-model annual-balance-walkthrough dong-boundary-model dong-boundary; do curl --fail --silent --show-error "${PAGE_URL%/}/$name.js" -o "live-$name.js"; done
          curl --fail --silent --show-error "${PAGE_URL%/}/comfort.css" -o live-comfort.css
          curl --fail --silent --show-error "${PAGE_URL%/}/read/xu-chapter4.html" -o live-xu-chapter4.html
          curl --fail --silent --show-error "${PAGE_URL%/}/read/research-framework.html" -o live-framework.html
          curl --fail --silent --show-error "${PAGE_URL%/}/read/liang-indicator-audit.html" -o live-indicator-audit.html
          curl --fail --silent --show-error "${PAGE_URL%/}/read/method-ledgers.html" -o live-method-ledgers.html
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/paper_minilab.py" -o live-minilab.py
          curl --fail --silent --show-error "${PAGE_URL%/}/downloads/index.html" -o live-downloads.html
          grep -q 'Paper-Translation' live-downloads.html
          grep -q '完整' live-framework.html
          grep -q 'definedAbbreviations' live-workspace.js
          grep -q 'window.PaperSync' live-sync.js
          grep -q 'window.PaperRelease' live-release.js
          grep -q 'window.PaperResearch' live-research.js
          grep -q 'window.PaperPersonal' live-personal.js
          grep -q 'window.PaperContracts' live-contracts.js
          grep -q '7个目标' live-xu-chapter4.html
          grep -q 'prefers-reduced-motion' live-comfort.css
          python live-minilab.py --test
          grep -q 'window.PaperContext' live-context-notes.js
          grep -q 'liang23-eleven' live-context-notes-data.js
          for name in context-notes research-walkthrough rda-model rda-walkthrough q-walkthrough annual-balance-model annual-balance-walkthrough dong-boundary-model dong-boundary; do
            curl --fail --silent --show-error "https://raw.githubusercontent.com/1337816143/Paper/$GITHUB_SHA/src/$name.js" -o "expected-$name.js"
            cmp "live-$name.js" "expected-$name.js"
          done
          node <<'JS'
          const assert = require('node:assert/strict');
          const walkthrough = require('./live-research-walkthrough.js');
          assert.equal(typeof walkthrough.mount, 'function');
          const result = walkthrough.model.farmPipeline();
          assert.deepEqual(result.rows.map(row => row.margin), [1900, 1700, 2200, 2600]);
          assert.deepEqual(result.fronts, [['A', 'C'], ['B']]);
          const rda = require('./live-rda-model.js');
          const config = JSON.parse(require('node:fs').readFileSync('live-rda-walkthrough-data.js','utf8').replace(/^window\.PAPER_RDA=/,'').replace(/;\s*$/,''));
          assert.equal(config.records.length, 4);
          const rd = rda.calculate(config.records);
          assert.ok(Math.abs(rd.total_inertia-2)<1e-10);
          assert.ok(Math.abs(rd.constrained_inertia-25/18)<1e-10);
          assert.ok(Math.abs(rd.residual_fraction-11/36)<1e-10);
          const q = JSON.parse(require('node:fs').readFileSync('live-q-walkthrough-data.js','utf8').replace(/^window\.PAPER_Q=/,'').replace(/;\s*$/,''));
          assert.equal(q.scenarios.length,2);
          const baseline = q.scenarios.find(x=>x.id==='baseline').result;
          const reversed = q.scenarios.find(x=>x.id==='reverse-p03').result;
          assert.equal(baseline.nstat,20); assert.equal(baseline.npeople,10);
          assert.deepEqual(baseline.flagged_counts,[5,4]);
          assert.deepEqual(baseline.factor_arrays,reversed.factor_arrays);
          assert.ok(reversed.weights[2][0]<0);
          const annual = require('./live-annual-balance-model.js');
          const a0 = annual.calculate(annual.defaults);
          const a1 = annual.calculate({...annual.defaults, lossFraction: 0.1});
          const a2 = annual.calculate({...annual.defaults, lossFraction: 0.1, replaceRetained: true});
          assert.deepEqual([a0.chainLoss,a0.soilResidual,a0.farmSurplus],[168,552,720]);
          assert.deepEqual([a1.chainLoss,a1.soilResidual,a1.farmSurplus],[84,636,720]);
          assert.deepEqual([a2.mineralNitrogen,a2.chainLoss,a2.soilResidual,a2.farmSurplus],[836,84,552,636]);
          assert.equal(typeof annual.calculate,'function');
          console.log('Served walkthroughs match their commit and preserve verified synthetic results');
          JS
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/farm_walkthrough.py?verify=$GITHUB_SHA" -o live-farm-walkthrough.py
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/farm_walkthrough_synthetic.csv?verify=$GITHUB_SHA" -o farm_walkthrough_synthetic.csv
          python live-farm-walkthrough.py --test
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/rda_walkthrough.py?verify=$GITHUB_SHA" -o live-rda-walkthrough.py
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/rda_synthetic_villages.csv?verify=$GITHUB_SHA" -o rda_synthetic_villages.csv
          python live-rda-walkthrough.py --test
          curl --fail --silent --show-error "${PAGE_URL%/}/library/cheng-2023/7b8cf2416ee8/p9-figure1.png?verify=$GITHUB_SHA" -o live-rda-original-figure.png
          python -c "import hashlib; assert hashlib.sha256(open('live-rda-original-figure.png','rb').read()).hexdigest()=='74592a6bfa1be2f5645402c0405d79de80e2faee76f2a6e4ef7ffc3527154d23'"
          curl --fail --silent --show-error "${PAGE_URL%/}/read/cheng-2023-rda-walkthrough.html?verify=$GITHUB_SHA" -o live-rda-guide.html
          grep -q "0.272166" live-rda-guide.html
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/q_synthetic.csv?verify=$GITHUB_SHA" -o live-q-synthetic.csv
          python -c "import hashlib; assert hashlib.sha256(open('live-q-synthetic.csv','rb').read()).hexdigest()=='4d7edb10053a7695a7cbe5da15d4c12f4fd68d48f0622f38ca3543c829f9c88b'"
          curl --fail --silent --show-error "${PAGE_URL%/}/read/cheng-2025-q-walkthrough.html?verify=$GITHUB_SHA" -o live-q-guide.html
          grep -q "Farmer_1" live-q-guide.html
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/annual_balance.py?verify=$GITHUB_SHA" -o live-annual-balance.py
          curl --fail --silent --show-error "${PAGE_URL%/}/examples/annual_balance_synthetic.csv?verify=$GITHUB_SHA" -o annual_balance_synthetic.csv
          python live-annual-balance.py --test
          python live-annual-balance.py --input annual_balance_synthetic.csv --json > live-annual-default.json
          python -c "import json; d=json.load(open('live-annual-default.json')); assert d['farmSurplus']==720 and d['soilResidual']==552"
          curl --fail --silent --show-error "${PAGE_URL%/}/read/farmdesign-2012-balance-walkthrough.html?verify=$GITHUB_SHA" -o live-annual-guide.html
          grep -q 'Appendix I' live-annual-guide.html
      - name: Download the exact tested tree digest
        uses: actions/download-artifact@v4
        with:
          name: paper-exact-deployment-audit
          path: audit
      - name: Compare every served file with the exact tested deployment bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYLIVE'
          import concurrent.futures, hashlib, json, os, time, urllib.request, urllib.parse
          audit=json.load(open('audit/offline-deployment-exact-tree.json'))
          assert audit['sourceCommit']==os.environ['GITHUB_SHA']
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          def verify(row):
              url=base+urllib.parse.quote(row['path'],safe='/')+'?offline-verify='+os.environ['GITHUB_SHA']
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as response:
                          digest=hashlib.sha256();size=0
                          while chunk:=response.read(1024*1024):digest.update(chunk);size+=len(chunk)
                      assert size==row['bytes'] and digest.hexdigest()==row['sha256'],row['path']
                      return row['path']
                  except Exception:
                      if attempt==7:raise
                      time.sleep(5)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:verified=list(pool.map(verify,audit['files']))
          json.dump({'status':'passed','sourceCommit':audit['sourceCommit'],'files':len(verified),'bytes':audit['bytes'],'manifestSHA256':audit['manifestSHA256'],'includesExactManifestAndWorkerBytes':True},open('live-full-offline-integrity.json','w'),indent=2)
          print('Verified every served payload and control:',len(verified),'files')
          PYLIVE
      - uses: actions/upload-artifact@v4
        with:
          name: paper-live-verification
          path: live-*
          retention-days: 30
