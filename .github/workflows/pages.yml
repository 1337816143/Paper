name: Test and publish Paper Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check teaching algorithms and original archive
        run: |
          python scripts/build.py --source-commit="$GITHUB_SHA"
          node --check src/app.js
          node --check src/reader.js
          python examples/pareto_lab.py --test
          python examples/sequence_lab.py
      - name: Install browser test runtime
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test existing tutorials
        run: python scripts/test_browser.py
      - name: Test original reading, annotations, source download and full offline
        run: python scripts/test_reader.py
      - name: Save test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-site-and-tests
          path: test-results
          retention-days: 30
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public release and source catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "${PAGE_URL%/}/release.json?verify=$GITHUB_SHA" -o live-release.json && python -c "import json,os; d=json.load(open('live-release.json')); assert d['sourceCommit']==os.environ['GITHUB_SHA']; assert d['archivedOriginals']>=12; print(d)"; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = true
          curl --fail --silent --show-error "${PAGE_URL%/}/resources.js" -o live-source-catalog.js
          curl --fail --silent --show-error "${PAGE_URL%/}/downloads/index.html" -o live-downloads.html
          grep -q '原文分卷' live-downloads.html
      - uses: actions/upload-artifact@v4
        with:
          name: paper-live-verification
          path: |
            live-release.json
            live-source-catalog.js
            live-downloads.html
          retention-days: 30
