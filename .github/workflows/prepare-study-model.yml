name: Prepare offline English-Chinese reader model
on:
  push:
    branches: [study-bilingual-framework-v3]
    paths: [scripts/vendor_translation.py, .github/workflows/prepare-study-model.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-study-model-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study-bilingual-framework-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download explicitly licensed model and browser runtime only
        run: python scripts/vendor_translation.py
      - name: Commit only public runtime assets
        run: |
          git config user.name paper-study-builder
          git config user.email paper-study-builder@users.noreply.github.com
          git add vendor/translation
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned offline English-Chinese model with licenses and SHA256 manifest"
            git pull --rebase origin study-bilingual-framework-v3
            git push origin HEAD:study-bilingual-framework-v3
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-asset-manifest
          path: vendor/translation/manifest.json
          retention-days: 14
